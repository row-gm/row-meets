trong&gt; mean?&lt;/div&gt;&lt;div style="font-family:Arial, Helvetica, sans-serif;font-size:14.5px;color:#152225;line-height:1.65;"&gt;It is the date we need your answer by. Log into your ROW member account and confirm or decline each meet. If we do not hear from you by that date, you are not entered.&lt;/div&gt;&lt;/div&gt;&lt;div style="padding:18px 22px;background:#FFFFFF;border-top:1px solid #DAD3C2;"&gt;&lt;div style="font-family:Arial, Helvetica, sans-serif;font-size:15.5px;font-weight:700;color:#0A2E3F;margin-bottom:6px;"&gt;What if I cannot make a meet I am entered in?&lt;/div&gt;&lt;div style="font-family:Arial, Helvetica, sans-serif;font-size:14.5px;color:#152225;line-height:1.65;"&gt;Decline it in your ROW member account before the Confirm By date, and tell your coach. After that date the club has usually paid your entry, so it cannot be refunded.&lt;/div&gt;&lt;/div&gt;&lt;div style="padding:18px 22px;background:#FAF8F2;border-top:1px solid #DAD3C2;"&gt;&lt;div style="font-family:Arial, Helvetica, sans-serif;font-size:15.5px;font-weight:700;color:#0A2E3F;margin-bottom:6px;"&gt;What does a &lt;strong&gt;Peak&lt;/strong&gt; meet mean for me?&lt;/div&gt;&lt;div style="font-family:Arial, Helvetica, sans-serif;font-size:14.5px;color:#152225;line-height:1.65;"&gt;It is the top of your racing calendar, the biggest meet of your season. Your training through the year is planned so you are at your best for it. Not every group has one, and that is on purpose rather than something missing.&lt;/div&gt;&lt;/div&gt;&lt;div style="padding:18px 22px;background:#FFFFFF;border-top:1px solid #DAD3C2;"&gt;&lt;div style="font-family:Arial, Helvetica, sans-serif;font-size:15.5px;font-weight:700;color:#0A2E3F;margin-bottom:6px;"&gt;Why does the pool length matter?&lt;/div&gt;&lt;div style="font-family:Arial, Helvetica, sans-serif;font-size:14.5px;color:#152225;line-height:1.65;"&gt;A 25 metre pool is called short course and a 50 metre pool is called long course. There are more turns in a short course race, so times from the two are not compared with each other. You keep a best time in each.&lt;/div&gt;&lt;/div&gt;&lt;div style="padding:18px 22px;background:#FAF8F2;border-top:1px solid #DAD3C2;"&gt;&lt;div style="font-family:Arial, Helvetica, sans-serif;font-size:15.5px;font-weight:700;color:#0A2E3F;margin-bottom:6px;"&gt;What are qualifying times?&lt;/div&gt;&lt;div style="font-family:Arial, Helvetica, sans-serif;font-size:14.5px;color:#152225;line-height:1.65;"&gt;Some meets only accept swimmers who have already swum a set time. Your coach will tell you if you have one. Every meet marked &lt;strong&gt;All Welcome&lt;/strong&gt; is open to everyone in your group.&lt;/div&gt;&lt;/div&gt;&lt;div style="padding:18px 22px;background:#FFFFFF;border-top:1px solid #DAD3C2;"&gt;&lt;div style="font-family:Arial, Helvetica, sans-serif;font-size:15.5px;font-weight:700;color:#0A2E3F;margin-bottom:6px;"&gt;Do my parents need to help at meets?&lt;/div&gt;&lt;div style="font-family:Arial, Helvetica, sans-serif;font-size:14.5px;color:#152225;line-height:1.65;"&gt;At the meets ROW hosts, yes. Those rows say &lt;strong&gt;At our pool. Officials needed.&lt;/strong&gt; A meet cannot run without officials and volunteers from our own families. The Officiating page explains how to start, and no experience is needed.&lt;/div&gt;&lt;/div&gt;&lt;div style="padding:18px 22px;background:#FAF8F2;border-top:1px solid #DAD3C2;"&gt;&lt;div style="font-family:Arial, Helvetica, sans-serif;font-size:15.5px;font-weight:700;color:#0A2E3F;margin-bottom:6px;"&gt;Is this schedule final?&lt;/div&gt;&lt;div style="font-family:Arial, Helvetica, sans-serif;font-size:14.5px;color:#152225;line-height:1.65;"&gt;Meets marked not confirmed can still move. We update this page as soon as anything changes, so check back before your family books travel.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style="border-left:4px solid #3FBFB0;background:#EFFAF8;border-radius:0 10px 10px 0;padding:16px 20px;margin:20px 0 0;font-size:14.5px;color:#152225;font-family:Arial, Helvetica, sans-serif;line-height:1.6;"&gt;Not sure which meets are right for you? Ask your coach on deck. For entries and payments, your family can email the club office at &lt;strong&gt;office@rowswimming.ca&lt;/strong&gt;.&lt;/div&gt;&lt;/div&gt;</textarea>
